[project]
name = "aion-docs-assistant"
version = "0.1.0"
description = "Grounded documentation assistant over two Kubernetes doc releases."
requires-python = ">=3.10"

# ruff handles PEP 8 style, import order and formatting.
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["corpus", "index"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.format]
quote-style = "double"

# pylint is the stricter second opinion. Docstring and naming rules stay on.
[tool.pylint.main]
ignore = ["corpus", "index", ".venv"]
py-version = "3.10"

[tool.pylint.format]
max-line-length = 100

# Settings holds every env var in one place, and the pipeline's ask() reads top to
# bottom on purpose, so both limits are a little looser than the defaults.
[tool.pylint.design]
max-attributes = 25
max-locals = 30

[tool.pylint."messages control"]
disable = ["too-few-public-methods", "fixme"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
exclude = ["corpus/", "index/", "benchmarks/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
